version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # @types/node follows the minimum supported Node version (22), not the latest.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Minor and patch updates in one pull request; each major on its own.
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
